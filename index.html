<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1016">
<title>ЦОД Экибастуз — AR</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%224%22 width=%2212%22 height=%228%22 rx=%221%22 fill=%22%2336c2a8%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.min.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<canvas id="dbg"></canvas>

<div id="start" class="panel start">
  <div class="brand">QazTWIN · ЦОД</div>
  <h1>Цифровой двойник<br>дата-центра</h1>
  <p>Наведите камеру на макет, стоящий на AR-коврике: модель встанет прямо на него.</p>
  <button id="btnAr" class="primary">Запустить AR</button>
  <button id="btn3d" class="ghost">Смотреть в 3D без камеры</button>
  <div id="loadBar"><div id="loadFill"></div></div>
  <div id="loadText" class="muted">Загрузка модели…</div>
  <div id="startErr" class="err"></div>
</div>

<div id="hud" hidden>
  <div id="status" class="pill">Ищу коврик…</div>
  <div id="bar">
    <button data-t="site" class="on">Площадка</button>
    <button data-t="xray">X-ray</button>
    <button data-t="settings">⚙</button>
  </div>
</div>

<div id="settings" class="panel sheet" hidden>
  <div class="row head"><b>Калибровка</b><button id="close" class="ghost small">Готово</button></div>
  <p class="muted">Сдвиньте модель, если она стоит на макете неточно. Сохраняется на этом телефоне.</p>
  <label>Сдвиг X, мм <output></output><input type="range" data-k="dx" min="-20" max="20" step="0.5"></label>
  <label>Сдвиг Z, мм <output></output><input type="range" data-k="dz" min="-20" max="20" step="0.5"></label>
  <label>Высота, мм <output></output><input type="range" data-k="dy" min="-10" max="10" step="0.5"></label>
  <label>Поворот, ° <output></output><input type="range" data-k="rot" min="-5" max="5" step="0.1"></label>
  <label>Масштаб, % <output></output><input type="range" data-k="scale" min="95" max="105" step="0.1"></label>
  <label>Угол обзора камеры, ° <output></output><input type="range" data-k="fov" min="0" max="85" step="0.5"></label>
  <p class="muted small">0 = авто (оценивается по коврику) · сейчас: <span id="fovNow">—</span></p>
  <label class="check"><input type="checkbox" data-k="showBoard"> Показать контур коврика</label>
  <label class="check"><input type="checkbox" data-k="debug"> Отладка: найденные метки</label>
  <div class="row"><button id="reset" class="ghost small">Сбросить</button><span id="stats" class="muted small"></span></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
